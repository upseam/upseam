name: Bug
description: Upseam did something wrong or failed.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste secrets, private code or anything you would not post publicly. Private matters go to contact@upseam.dev.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - GitHub App
        - GitHub Action
        - CLI
        - Slack
        - Website or docs
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provider, SDK and API version, the command or the pull request.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx @upseam/cli --version`, if you use the CLI.
